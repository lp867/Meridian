name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nur die Rechte, die das Veröffentlichen braucht
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pages gibt es im Gratis-Plan nur für öffentliche Repos – bei privatem Repo überspringen
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      # Aktionen auf feste Commits gepinnt (Schutz, falls ein Tag nachträglich verändert wird)
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      # Keine Installationsskripte von Paketen ausführen (Schutz vor manipulierten Paketen)
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: node scripts/check-i18n.mjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
